id = "hlimas.project-picker"
name = "Workspace Manager"
version = "0.3.0"
min_herdr_version = "0.7.5"
description = "Create, open, and close multi-repository GitHub workspaces"
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Manage workspaces"
description = "Create, open, or close a GitHub workspace"
command = ["bash", "open-picker.sh"]

[[panes]]
id = "picker"
title = "Workspace Manager"
description = "Create, open, or close a workspace"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "project-picker.sh"]
