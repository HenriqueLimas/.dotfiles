id = "hlimas.project-picker"
name = "Workspace Manager"
version = "0.7.0"
min_herdr_version = "0.7.5"
description = "Create, open, and close single-repository Git workspaces"
platforms = ["macos", "linux"]

[[actions]]
id = "open"
title = "Manage workspaces"
description = "Create or open a repository worktree"
command = ["bash", "open-picker.sh"]

[[actions]]
id = "close"
title = "Close workspace"
description = "Close the current workspace and keep or permanently delete its folders"
command = ["bash", "open-picker.sh", "closer"]

[[actions]]
id = "close-pane"
title = "Close pane"
description = "Close the current pane, prompting for folders when it is the last pane"
command = ["bash", "open-picker.sh", "pane-closer"]

[[panes]]
id = "picker"
title = "Workspace Manager"
description = "Create or open a repository worktree"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "project-picker.sh"]

[[panes]]
id = "closer"
title = "Close Workspace"
description = "Close the current workspace and keep or permanently delete its folders"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "project-picker.sh", "close"]

[[panes]]
id = "pane-closer"
title = "Close Pane"
description = "Close the current pane, prompting for folders when it is the last pane"
placement = "popup"
width = "80%"
height = "80%"
command = ["bash", "project-picker.sh", "close-pane"]
